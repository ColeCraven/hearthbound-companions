plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Polymer (optional, server-side only). Local copies in libs/polymer win; otherwise Polymer's own Maven.
	flatDir {
		dirs "libs/polymer"
	}
	maven {
		url = "https://maven.nucleoid.xyz/"
		content {
			includeGroup "eu.pb4"
		}
	}
}

loom {
	// Keeps rendering/screen code in src/client so the server never loads client classes.
	splitEnvironmentSourceSets()

	mods {
		"hearthbound" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		// Creates src/gametest with runGameTest (also run by `check`) and runClientGameTest.
		createSourceSet = true
		modId = "hearthbound-test"
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Lets unmodded players join a server running Hearthbound. Only used when Polymer is installed.
	compileOnly "eu.pb4:polymer-core:${project.polymer_version}"
	compileOnly "eu.pb4:polymer-common:${project.polymer_version}"
	compileOnly "eu.pb4:polymer-networking:${project.polymer_version}"
	compileOnly "eu.pb4:polymer-reg-sync-manipulator:${project.polymer_version}"
	compileOnly "eu.pb4:polymer-resource-pack:${project.polymer_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.0"
}

processResources {
	def modVersion = project.version.toString()
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def archiveBase = project.base.archivesName.get()
	inputs.property "archivesName", archiveBase

	from("LICENSE") {
		rename { "${it}_${archiveBase}" }
	}
}
